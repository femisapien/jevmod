<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="Placeholder: a moderator reacts ❌ to a log embed and jevmod replies that the scam threshold is now 0.78">
  <title>❌ raises the line: noted, threshold for scam is now 0.78</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #313338; }
    .name { font-size: 30px; font-weight: 600; fill: #060607; }
    .ts { font-size: 22px; fill: #5C5E66; }
    .foot { font-size: 21px; fill: #5C5E66; }
    .react { font-size: 24px; }
    .ref { font-size: 22px; fill: #5C5E66; }
    .msg { font-size: 28px; }
    .cap { font-size: 22px; fill: #A1A1AA; }
  </style>
  <rect x="0.5" y="0.5" width="1599" height="599" fill="#FAFAFA" stroke="#E4E4E7"/>
  <rect x="80" y="40" width="1440" height="520" rx="8" fill="#FFFFFF" stroke="#E3E5E8"/>

  <!-- bottom of the log embed (cut by the top of the panel) -->
  <clipPath id="panel"><rect x="80" y="40" width="1440" height="520"/></clipPath>
  <g clip-path="url(#panel)">
    <rect x="230" y="-60" width="1180" height="180" rx="8" fill="#F2F3F5" stroke="#E3E5E8"/>
    <path d="M238 -60 h-4 a4 4 0 0 0 -4 4 v172 a4 4 0 0 0 4 4 h4 z" fill="#2FBF83"/>
    <line x1="262" y1="50" x2="1380" y2="50" stroke="#E3E5E8"/>
    <text x="262" y="96" class="foot">scam 0.99 · spam 0.98 · harassment 0.02   ·   ❌ false positive (raises threshold)  ·  ✅ correct (lowers it a notch)</text>
  </g>

  <!-- reactions: the moderator pressed ❌ (highlighted), the bot's own ✅ stays at 1 -->
  <rect x="230" y="146" width="86" height="48" rx="8" fill="#E0E3FC" stroke="#5865F2" stroke-width="2"/>
  <text x="252" y="179" class="react" fill="#505CDC">❌ 2</text>
  <rect x="330" y="146" width="86" height="48" rx="8" fill="#F2F3F5" stroke="#E3E5E8"/>
  <text x="352" y="179" class="react">✅ 1</text>

  <!-- reply from the bot to that embed -->
  <path d="M160 340 v-40 a12 12 0 0 1 12 -12 h40" fill="none" stroke="#B5BAC1" stroke-width="2.5"/>
  <circle cx="230" cy="288" r="14" fill="#2FBF83"/>
  <text x="256" y="296" class="ref"><tspan font-weight="600" fill="#313338">jevmod</tspan>  scam  p=0.99  →  flag</text>

  <circle cx="160" cy="390" r="40" fill="#2FBF83"/>
  <text x="160" y="404" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">j</text>
  <text x="230" y="386" class="name">jevmod</text>
  <rect x="338" y="362" width="66" height="30" rx="6" fill="#5865F2"/>
  <text x="371" y="384" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">APP</text>
  <text x="422" y="386" class="ts">Today at 14:33</text>
  <text x="230" y="440" class="msg">noted: threshold for <tspan font-weight="700">scam</tspan> is now 0.78</text>

  <text x="1500" y="536" text-anchor="end" class="cap">placeholder, replaced by a real capture</text>
</svg>
