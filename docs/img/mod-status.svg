<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Placeholder: the ephemeral reply to /mod status listing every category, its action and its threshold">
  <title>/mod status</title>
  <style>
