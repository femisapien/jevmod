<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="jevmod failure policy: Jev down means fail open; optional quota reached means pause and notify once">
<title>jevmod failure policy: Jev down means fail open; optional quota reached means pause and notify once</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717A"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A"/></marker></defs>
<rect width="1000" height="330" fill="#FAFAFA"/>
<text x="32" y="40" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#71717A" text-anchor="start">failure policy</text>
<text x="32" y="68" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3F3F46" text-anchor="start">Two things can go wrong. In neither case is a message deleted.</text>
<rect x="32" y="104" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="46" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">Jev unreachable</text>
<text x="46" y="151" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">timeout, 5xx, network</text>
<line x1="236" y1="136" x2="268" y2="136" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="272" y="104" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="286" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">fail open</text>
<text x="286" y="151" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">reason "error_open"</text>
<line x1="476" y1="136" x2="508" y2="136" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512" y="104" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="526" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">nothing acted on</text>
<text x="526" y="151" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">action none</text>
<line x1="716" y1="136" x2="748" y2="136" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="752" y="104" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="766" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">one warning per batch</text>
<text x="766" y="151" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">log channel or stderr</text>
<rect x="32" y="208" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="46" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">monthly quota reached</text>
<text x="46" y="255" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">JEVMOD_MONTHLY_QUOTA</text>
<line x1="236" y1="240" x2="268" y2="240" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="272" y="208" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="286" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">judging pauses</text>
<text x="286" y="255" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">messages pass untouched</text>
<line x1="476" y1="240" x2="508" y2="240" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512" y="208" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="526" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">owner told once</text>
<text x="526" y="255" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">not on every message</text>
<line x1="716" y1="240" x2="748" y2="240" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="752" y="208" width="200" height="64" rx="0" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
<text x="766" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0A0A0A" text-anchor="start">off by default</text>
<text x="766" y="255" font-family="'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#71717A" text-anchor="start">0 = unlimited</text>
<text x="32" y="306" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#71717A" text-anchor="start">Retries: 429 and 529 from Jev are retried with exponential backoff and Retry-After before a batch is declared failed.</text>
</svg>
