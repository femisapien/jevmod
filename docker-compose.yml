# One command, three services, one SQLite volume shared by all roles.
#   cp .env.example .env   (fill what you use)   ->   docker compose up -d
services:
  api:
    build: .
    environment: { JEVMOD_ROLE: api }
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
  discord:
    build: .
    environment: { JEVMOD_ROLE: discord }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["discord"]
  telegram:
    build: .
    environment: { JEVMOD_ROLE: telegram }
    env_file: .env
    volumes: ["jevmod-data:/data"]
    restart: unless-stopped
    profiles: ["telegram"]
volumes:
  jevmod-data: {}
