name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[all,dev,examples]
      - run: ruff check .
      - run: mypy jevmod
      - run: pytest tests -q
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jevmod:ci .
  jevmod-js:
    name: npm package (jevmod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jevmod-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/jevmod-js/package-lock.json
      - run: npm ci
      - run: npm run sync-categories && git diff --exit-code -- src/categories.json
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
