# Public demo behind an existing Traefik (Coolify's proxy): no ports published, TLS from the `letsencrypt` resolver.
#   cd deploy/demo && cp ../../.env.example .env   (fill it)
#   DEMO_HOST=jevmod.example.com docker compose -f docker-compose.traefik.yml up -d --build
services:
  demo:
    build: ../..
    container_name: jevmod-demo
    environment:
      JEVMOD_ROLE: demo
      JEVMOD_DEMO_DB: /data/jevmod-demo.sqlite
    env_file: .env
    volumes: ["jevmod-demo-data:/data"]
    restart: unless-stopped
    networks: [coolify]
    deploy:
      resources:
        limits: { memory: 512m }
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.jevmod-demo-http.entrypoints: http
      traefik.http.routers.jevmod-demo-http.rule: Host(`${DEMO_HOST}`) && PathPrefix(`/demo/`)
      traefik.http.routers.jevmod-demo-http.middlewares: jevmod-demo-https
      traefik.http.middlewares.jevmod-demo-https.redirectscheme.scheme: https
      traefik.http.routers.jevmod-demo-https.entrypoints: https
      traefik.http.routers.jevmod-demo-https.rule: Host(`${DEMO_HOST}`) && PathPrefix(`/demo/`)
      traefik.http.routers.jevmod-demo-https.tls: "true"
      traefik.http.routers.jevmod-demo-https.tls.certresolver: letsencrypt
      traefik.http.services.jevmod-demo.loadbalancer.server.port: "8080"
networks:
  coolify:
    external: true
volumes:
  jevmod-demo-data: {}
